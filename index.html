<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART i-C | SK Petrajaya Kuching</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            display: block;
            min-height: 100vh;
            padding: 15px;
        }

        /* Header Moden dengan Logo SKPJ di Kanan */
        .app-header {
            background: linear-gradient(135deg, #1c2541 0%, #0b132b 100%);
            border: 1px solid #3a506b;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.15);
        }

        .header-text {
            text-align: left;
            flex-grow: 1;
            padding-right: 10px;
        }

        .brand-title {
            color: #00e5ff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .brand-subtitle {
            color: #5bc0be;
            font-size: 11px;
            margin-top: 3px;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .school-name-header {
            color: #ffd700;
            font-size: 10px;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .school-logo {
            width: 60px;
            height: auto;
            flex-shrink: 0;
        }

        /* Card Layout */
        .card {
            background: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 13px;
            color: #5bc0be;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        select, input {
            width: 100%;
            padding: 12px;
            background: #0b132b;
            border: 1px solid #00e5ff;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        /* Camera Feed Section dengan Kesan Garisan Neon (Scanline) */
        .camera-card {
            background: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .viewfinder {
            width: 100%;
            max-width: 320px;
            height: 280px;
            margin: 0 auto 15px auto;
            background: #000000;
            border-radius: 12px;
            border: 2px solid #00e5ff;
            position: relative;
            overflow: hidden;
            display: block;
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.3);
        }

        /* Efek Ilustrasi Garisan Imbasan (Laser Scan Line) */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #00e5ff;
            box-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
            animation: scanning 2s infinite linear;
            display: none;
            z-index: 10;
        }

        @keyframes scanning {
            0% { top: 0%; }
            50% { top: 97%; }
            100% { top: 0%; }
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            border-radius: 10px;
        }

        .camera-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #5bc0be;
            font-size: 12px;
        }

        .btn-scan {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00e5ff 0%, #0088ff 100%);
            border: none;
            border-radius: 12px;
            color: #0b132b;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00b09b 0%, #96c93d 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            display: none;
            box-shadow: 0 0 15px rgba(0, 176, 155, 0.4);
        }

        /* Results Display */
        .result-card {
            background: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }

        .status-badge {
            font-size: 20px;
            font-weight: 800;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* Warna Dinamik Mengikut Permintaan */
        .status-clean { background: rgba(0, 230, 118, 0.25); color: #00e676; border: 2px solid #00e676; }
        .status-med { background: rgba(255, 152, 0, 0.25); color: #ff9800; border: 2px solid #ff9800; }
        .status-dirty { background: rgba(255, 23, 68, 0.25); color: #ff1744; border: 2px solid #ff1744; }

        .confidence-meter {
            height: 10px;
            background: #0b132b;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }

        .confidence-fill {
            height: 100%;
            background: #00e5ff;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Footer & Logo Avengers Bahagian Bawah */
        .app-footer {
            text-align: center;
            padding: 20px 10px 10px 10px;
            margin-top: 10px;
            border-top: 1px dashed #3a506b;
        }

        .footer-label {
            font-size: 11px;
            color: #5bc0be;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .avengers-logo {
            width: 65px;
            height: auto;
            margin-bottom: 6px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .footer-team {
            color: #00e5ff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <!-- Header Bersama Logo SKPJ di Kanan -->
    <div class="app-header">
        <div class="header-text">
            <div class="brand-title">SMART i-C</div>
            <div class="brand-subtitle">Sistem Pengesanan Kebersihan Bilik Darjah AI</div>
            <div class="school-name-header">Sekolah Kebangsaan Petrajaya (SKPJ) Kuching</div>
        </div>
        <img src="logo-skpj.png" alt="Logo SKPJ" class="school-logo" onerror="this.style.display='none'">
    </div>

    <!-- Dropdown Pilih / Tambah Kelas -->
    <div class="card">
        <div class="card-title">📍 Pilih / Tambah Bilik Darjah</div>
        <select id="select-kelas" onchange="semakPilihanKelas(this)">
            <option value="Kelas 1 Alpha">Kelas 1 Alpha</option>
            <option value="Kelas 2 Beta">Kelas 2 Beta</option>
            <option value="Makmal Sains">Makmal Sains</option>
            <option value="ADD_NEW_CLASS" style="font-weight: bold; color: #00e5ff;">➕ [ Tambah Kelas Baharu... ]</option>
        </select>
    </div>

    <!-- Camera Feed dengan Kesan Garisan Laser Imbasan -->
    <div class="camera-card">
        <div class="card-title" id="camera-status-title">📸 Kamera: Sedang Mengimbas...</div>
        <div class="viewfinder" id="viewfinder-box">
            <div class="scan-line" id="scanLaser"></div>
            <div class="camera-placeholder" id="placeholder-text">Tekan 'Buka Kamera' Untuk Mula</div>
            <div id="webcam-container"></div>
        </div>
        <button class="btn-scan" id="btn-start" type="button" onclick="init()">Buka Kamera AI</button>
    </div>

    <!-- Results Display -->
    <div class="result-card" id="result-box">
        <div class="card-title">📊 Analisis AI Real-Time</div>
        <div class="status-badge status-clean" id="status-text">MENUNGGU ANALISIS...</div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5bc0be;">
            <span>Tahap Keyakinan AI:</span>
            <span id="confidence-val">0%</span>
        </div>
        <div class="confidence-meter">
            <div class="confidence-fill" id="confidence-bar"></div>
        </div>
        <button class="btn-save" id="btn-hantar" type="button" onclick="hantarDataManual()">💾 Simpan Rekod Ke Sheets</button>
    </div>

    <!-- Footer Bahagian Bawah (Dibangunkan oleh Kumpulan & Logo AI Avengers) -->
    <div class="app-footer">
        <div class="footer-label">Dibangunkan oleh Kumpulan:</div>
        <img src="logo-avengers.png" alt="Logo AI Avengers" class="avengers-logo" onerror="this.style.display='none'">
        <div class="footer-team">AI AVENGERS</div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        const URL_MODEL_TM = "https://teachablemachine.withgoogle.com/models/8T1UNdXAx/"; 
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzE_Hm9DdGq3ICixBiC_m78B0lnzW7tlQx1UebWT7-rD5kDbp4JN5WqZQbDTZWP8fHH/exec"; 

        let model, webcam, labelContainer, maxPredictions;
        let currentStatus = "", currentConfidence = 0;

        window.onload = function() {
            muatKelasTersimpan();
        };

        function muatKelasTersimpan() {
            const select = document.getElementById("select-kelas");
            const kelasTersimpan = JSON.parse(localStorage.getItem("smart_ic_custom_classes")) || [];
            
            kelasTersimpan.forEach(namaKelas => {
                let opt = document.createElement("option");
                opt.value = namaKelas;
                opt.innerText = namaKelas;
                select.insertBefore(opt, select.lastElementChild);
            });
        }

        function semakPilihanKelas(selectElement) {
            if (selectElement.value === "ADD_NEW_CLASS") {
                let namaBaharu = prompt("Masukkan Nama Kelas / Bilik Baharu:");
                if (namaBaharu && namaBaharu.trim() !== "") {
                    namaBaharu = namaBaharu.trim();
                    
                    let kelasTersimpan = JSON.parse(localStorage.getItem("smart_ic_custom_classes")) || [];
                    if (!kelasTersimpan.includes(namaBaharu)) {
                        kelasTersimpan.push(namaBaharu);
                        localStorage.setItem("smart_ic_custom_classes", JSON.stringify(kelasTersimpan));
                    }

                    let opt = document.createElement("option");
                    opt.value = namaBaharu;
                    opt.innerText = namaBaharu;
                    selectElement.insertBefore(opt, selectElement.lastElementChild);
                    selectElement.value = namaBaharu; 
                } else {
                    selectElement.selectedIndex = 0; 
                }
            }
        }

        async function init() {
            document.getElementById("btn-start").innerText = "MEMUATKAN AI...";
            document.getElementById("btn-start").disabled = true;

            const modelURL = URL_MODEL_TM + "model.json";
            const metadataURL = URL_MODEL_TM + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalPredictions();

                const flip = true; 
                webcam = new tmImage.Webcam(300, 300, flip); 
                await webcam.setup({ facingMode: "environment" }); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("placeholder-text").style.display = "none";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                
                // Paparkan kotak keputusan & aktifkan garisan imbasan laser
                document.getElementById("result-box").style.display = "block";
                document.getElementById("scanLaser").style.display = "block";
                
                // Tukar teks tajuk kamera kepada "Berjaya Mengimbas"
                document.getElementById("camera-status-title").innerText = "📸 Kamera: Berjaya Mengimbas (Live)";
                document.getElementById("btn-start").style.display = "none";
                document.getElementById("btn-hantar").style.display = "block";

            } catch (err) {
                alert("Ralat Kamera / Model: Sila pastikan kebenaran kamera (Camera Permission) diizinkan!");
                document.getElementById("btn-start").innerText = "Buka Kamera AI";
                document.getElementById("btn-start").disabled = false;
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let highest = { className: "", probability: 0 };
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highest.probability) {
                    highest = prediction[i];
                }
            }

            currentStatus = highest.className;
            currentConfidence = (highest.probability * 100).toFixed(1);

            const statusElem = document.getElementById("status-text");
            statusElem.innerText = currentStatus.toUpperCase();
            
            // Logik warna butang/badge mengikut permintaan:
            // Sangat Bersih = Hijau, Sederhana Bersih = Jingga, Kotor = Merah
            statusElem.className = "status-badge ";
            let lowerStatus = currentStatus.toLowerCase();
            
            if (lowerStatus.includes("bersih") && !lowerStatus.includes("sederhana")) {
                statusElem.classList.add("status-clean"); // Hijau
            } else if (lowerStatus.includes("sederhana")) {
                statusElem.classList.add("status-med"); // Jingga / Orange
            } else {
                statusElem.classList.add("status-dirty"); // Merah
            }

            document.getElementById("confidence-val").innerText = currentConfidence + "%";
            document.getElementById("confidence-bar").style.width = currentConfidence + "%";
        }

        async function hantarDataManual() {
            const namaKelas = document.getElementById("select-kelas").value;
            if(namaKelas === "ADD_NEW_CLASS") {
                alert("Sila pilih atau tambah nama kelas yang sah dolok!");
                return;
            }

            const btn = document.getElementById("btn-hantar");
            btn.innerText = "MENGHANTAR...";
            btn.disabled = true;

            const payload = {
                namaKelas: namaKelas,
                status: currentStatus,
                keyakinan: currentConfidence,
                catatan: "Imbasan SMART i-C (SKPJ Kuching)"
            };

            try {
                await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                alert("BERJAYA! Rekod kebersihan " + namaKelas + " telah disimpan ke Google Sheets.");
            } catch (e) {
                alert("Ralat menghantar data!");
            } finally {
                btn.innerText = "💾 Simpan Rekod Ke Sheets";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
